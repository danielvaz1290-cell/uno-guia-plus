<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNO Guia+ | Orientação para bolsas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --uno-navy:#0400A1;
    --uno-blue:#0400A1;
    --uno-cyan:#57D6DC;
    --uno-purple:#0400A1;
    --uno-bg:#F3F4F3;
    --uno-white:#FFFFFF;
    --ink:#141414;
    --ink-soft:#54595E;
    --ink-faint:#8A8F94;
    --border:#E5E5E5;
    --border-strong:#DDDEDD;
    --warn-bg:#FFF6E0;
    --warn-text:#8A5300;
    --warn-border:#FEE8AC;
    --ok:#159C63;
    --ok-bg:#E7F8F0;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --grad: linear-gradient(90deg, var(--uno-blue) 0%, var(--uno-cyan) 100%);
    --shadow-card: 0 4px 14px rgba(4,0,161,0.12);
    --shadow-pop: 0 12px 34px rgba(4,0,161,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--uno-bg);
    color:var(--ink);
    font-family:'Rubik',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Rubik',system-ui,sans-serif;
    font-weight:700;
    letter-spacing:0;
    margin:0;
  }
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--uno-blue);color:#fff;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:14px 20px;
    background:var(--uno-navy);
    border-bottom:none;
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    background:#fff;
  }
  .brand-name{
    font-family:'Rubik',sans-serif;font-weight:700;font-size:16px;color:#fff;
    line-height:1.1;
  }
  .brand-sub{
    font-size:10.5px;color:rgba(255,255,255,0.65);letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  }
  .badge-portal{
    font-size:11px;font-weight:600;color:#fff;
    background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.24);
    padding:5px 10px;border-radius:999px;
    display:flex;align-items:center;gap:6px;
  }
  .badge-portal .dot{width:6px;height:6px;border-radius:50%;background:var(--uno-cyan);}

  main{
    flex:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:0 18px 48px;
    position:relative;
  }

  /* progress bar */
  .progress-wrap{
    padding:18px 0 6px;
  }
  .progress-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .progress-step{
    font-size:12px;font-weight:700;color:var(--uno-blue);letter-spacing:.03em;text-transform:uppercase;
  }
  .progress-track{
    height:6px;border-radius:99px;background:var(--border);overflow:hidden;
  }
  .progress-fill{
    height:100%;border-radius:99px;background:var(--grad);
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--ink-soft);font-size:13.5px;font-weight:600;
    background:none;border:none;padding:6px 0;margin-bottom:6px;
  }
  .back-link:hover{color:var(--uno-blue);}

    position:relative;
    border-radius:16px;
    overflow:hidden;

    background-size:cover;
    background-position:center;
    padding:44px 26px 38px;
    margin-top:22px;
    color:#fff;
    isolation:isolate;
  }
  .hero-blob svg.blob{display:none;}
  .hero-inner{position:relative;z-index:2;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:#CFE0FF;
    background:rgba(255,255,255,0.12);
    padding:6px 12px;border-radius:999px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.16);
  }
  .hero-title{
    font-size:38px;font-weight:800;line-height:1.05;margin-bottom:14px;
  }
  .hero-sub{
    font-size:16px;font-weight:500;color:#DCE6FF;line-height:1.5;margin-bottom:18px;
    max-width:46ch;
  }
  .hero-desc{
    font-size:14.5px;color:#B9C7EE;line-height:1.6;margin-bottom:28px;max-width:50ch;
  }
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .btn{
    border:none;border-radius:999px;
    padding:15px 26px;
    font-weight:700;font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:#fff;color:var(--uno-navy);
    box-shadow:0 10px 26px rgba(0,0,0,0.18);
  }
  .btn-primary:hover{box-shadow:0 14px 32px rgba(0,0,0,0.24);}
  .btn-primary.on-light{
    background:var(--grad);color:#fff;
    box-shadow:0 10px 24px rgba(4,0,161,0.28);
  }
  .btn-primary.on-light:hover{box-shadow:0 14px 30px rgba(4,0,161,0.36);}
  .btn-secondary{
    background:var(--uno-white);color:var(--uno-navy);
    border:1.5px solid var(--border-strong);
  }
  .btn-secondary:hover{border-color:var(--uno-blue);color:var(--uno-blue);background:#DDDEDD;}
  .btn-ghost{
    background:transparent;color:var(--ink-soft);border:1.5px solid transparent;
    font-weight:600;font-size:14px;padding:12px 18px;border-radius:999px;
  }
  .btn-ghost:hover{color:var(--uno-blue);}
  .btn-block{width:100%;}
  .btn-lg{padding:17px 28px;font-size:16px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}

  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:#FFF6E0;border:1px solid #FEE8AC;
    border-radius:var(--radius-md);
    padding:14px 16px;margin-top:18px;
    font-size:13px;color:var(--ink-soft);line-height:1.55;
  }
  .notice svg{flex-shrink:0;margin-top:1px;}
  .notice b{color:var(--uno-navy);}

  /* section headers */
  .section-eyebrow{
    font-size:12px;font-weight:700;color:var(--uno-blue);
    text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:10px;
  }
  .h-title{font-size:26px;font-weight:800;color:var(--uno-navy);line-height:1.2;margin-bottom:8px;}
  .h-sub{font-size:15px;color:var(--ink-soft);line-height:1.55;margin-bottom:26px;}

  /* program cards */
  .prog-grid{display:flex;flex-direction:column;gap:16px;margin-top:6px;}
  .prog-card{
    text-align:left;
    background:var(--uno-white);
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    display:flex;flex-direction:column;gap:12px;
    transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .prog-card:hover{border-color:var(--uno-blue);box-shadow:var(--shadow-card);transform:translateY(-2px);}
  .prog-icon{
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;
  }
  .prog-name{font-family:'Rubik',sans-serif;font-weight:700;font-size:18px;color:var(--uno-navy);}
  .prog-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .prog-cta{
    display:flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:700;color:var(--uno-blue);
    margin-top:2px;
  }

  /* quiz card */
  .q-card{
    background:var(--uno-white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px 22px 22px;
    box-shadow:var(--shadow-card);
  }
  .q-title{font-size:22px;font-weight:800;color:var(--uno-navy);line-height:1.28;margin-bottom:6px;}
  .q-help{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5;}
  .opt-list{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    text-align:left;
    background:var(--uno-bg);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:15px 16px;
    font-size:14.5px;font-weight:600;color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .opt-btn .chev{color:var(--ink-faint); flex-shrink:0;}

   Fonte: bloco <script id="uno-textos"> no fim da página.
   Os textos vêm de lá; a lógica do guia não foi alterada. */
const TEXTOS = JSON.parse(document.getElementById('uno-textos').textContent);
function perguntaTexto(id){
  const P=TEXTOS.perguntas[id];
  const multi=(id==='patrimonioTipos');
  const resp=(state.program==='federal'?state.answersLF:state.answers)[id];
  return q(P.titulo,P.ajuda,`<div class="opt-list">${P.respostas.map(o=>opt(o.valor,o.rotulo,resp,id,multi)).join('')}</div>`);
}

  app.innerHTML=topbar()+`<main id="main">${renderView()}</main>`+footerHtml()+(modalOpen?renderModal():'');
  bindEvents();
  window.scrollTo({top:0,behavior:'instant'});
}
function topbar(){return `<div class="topbar"><div class="brand"><div class="brand-mark"><img src="${UNO_LOGO_SRC}" alt="Logo Unochapecó" style="width:100%;height:100%;object-fit:cover;display:block;"></div><div><div class="brand-name">UNO Guia+</div><div class="brand-sub">Orientação · Bolsas</div></div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;"><a href="https://site.uno.edu.br/" target="_blank" rel="noopener noreferrer" class="badge-portal" style="text-decoration:none;cursor:pointer;"><span class="dot"></span> Site da UNO</a><div class="badge-portal"><span class="dot"></span> Ferramenta de orientação</div></div></div>`;}

function renderView(){switch(state.view){case'welcome':return viewWelcome();case'program':return viewProgram();case'quiz':return viewQuiz();case'review':return viewReview();case'checklist':return viewChecklist();default:return viewWelcome();}}

function viewProgram(){return `<div class="progress-wrap fade-in"><button class="back-link" data-action="to-welcome">${ICONS.back} Voltar</button></div><div class="section-eyebrow">Etapa 1 de 2 · Programa</div><h2 class="h-title">Qual programa de bolsa você deseja consultar?</h2><p class="h-sub">Selecione o programa para receber um checklist adaptado às regras dele.</p><div class="prog-grid"><button class="prog-card" data-action="select-program" data-program="gratuita"><div class="prog-icon">${ICONS.cap}</div><div class="prog-name">Universidade Gratuita</div><div class="prog-desc">Responda ao questionário completo e receba a lista de documentos aplicável à sua situação.</div><div class="prog-cta">Selecionar ${ICONS.chev}</div></button><button class="prog-card" data-action="select-program" data-program="federal"><div class="prog-icon">${ICONS.scale}</div><div class="prog-name">Lei Federal</div><div class="prog-desc">Responda ao questionário baseado no Edital nº 014/REITORIA/2026 e receba a lista de documentos aplicável à sua situação.</div><div class="prog-cta">Selecionar ${ICONS.chev}</div></button></div>`;}
function programLabel(){return state.program==='gratuita'?'Universidade Gratuita':'Lei Federal';}

function getQuizSteps(){
 if(state.program==='federal') return getQuizStepsLF();
 const a=state.answers, s=['nasceuSC'];
 if(a.nasceuSC==='Não') s.push('resideSC5');
 s.push('graduacaoAnterior','deficiencia','recebeAjuda');
 if(a.recebeAjuda==='Não') s.push('pagaSozinho');
 s.push('outraPessoa','estudanteRenda','familia','moradia');
 if(a.moradia==='alugada') s.push('aluguelContrato');
 if(a.moradia==='inventario') s.push('inventarioAberto');
 s.push('patrimonioPossui');
 if(a.patrimonioPossui==='Sim') s.push('patrimonioTipos','patrimonioIR');
 s.push('enderecoConta');
 return s;
}
/* Etapas que avançam sozinhas assim que uma opção é tocada (1 clique).
   'familia' (cadastro de integrantes) e 'patrimonioTipos' (seleção múltipla)
   continuam usando o botão Continuar, pois exigem mais de uma ação. */
const AUTO_ADVANCE_FIELDS=new Set(['nasceuSC','resideSC5','graduacaoAnterior','deficiencia','recebeAjuda','pagaSozinho','outraPessoa','estudanteRenda','moradia','aluguelContrato','inventarioAberto','patrimonioPossui','patrimonioIR','enderecoConta']);

/* ---------------- Lei Federal (LF) — sequência de perguntas ---------------- */
function getQuizStepsLF(){
  const a=state.answersLF, s=['lf_matriculado'];
  if(a.lf_matriculado==='Não'){ s.push('lf_stop'); return s; }
  if(a.lf_matriculado!=='Sim') return s;
  s.push('lf_concluiuGrad');
  if(a.lf_concluiuGrad==='Sim'){ s.push('lf_stop'); return s; }
  if(a.lf_concluiuGrad!=='Não') return s;
  s.push('lf_primeiraGrad');
  if(a.lf_primeiraGrad==='Não'){ s.push('lf_stop'); return s; }
  if(a.lf_primeiraGrad!=='Sim') return s;
  s.push('lf_brasileiro');
  if(a.lf_brasileiro==='Não'){ s.push('lf_stop'); return s; }
  if(a.lf_brasileiro!=='Sim') return s;
  s.push('lf_financiamentoIncompativel');
  if(a.lf_financiamentoIncompativel==='Sim'){ s.push('lf_stop'); return s; }
  if(a.lf_financiamentoIncompativel!=='Não') return s;
  s.push('lf_bolsaIntegral','lf_moraSozinho');
  if(a.lf_moraSozinho==='Sim'){
    s.push('lf_ajudaMesmoSozinho');
    if(a.lf_ajudaMesmoSozinho==='Sim') s.push('lf_outroEnderecoDepende');
  } else if(a.lf_moraSozinho==='Não'){
    s.push('lf_outroEnderecoDepende');
  }
  s.push('lf_dependenteIR','lf_paisForaGrupo','lf_grupoSemVinculo','lf_familia','lf_estudanteTemRenda');
  if(a.lf_estudanteTemRenda==='Sim') s.push('lf_estudanteRenda');
  s.push('lf_patrimonioPossui','lf_moradia');
  if(a.lf_moradia==='Alugada'){ s.push('lf_aluguelTipo','lf_sublocacao'); }
  s.push('lf_outroMembroParticular','lf_doencaCronica','lf_transporteColetivo','lf_contaConsumo');
  return s;
}
function lfStopMessage(){
  const a=state.answersLF;
  const E=TEXTOS.encerramentos;
  const m=(k)=>({title:E[k].titulo,desc:E[k].descricao,action:E[k].orientacao});
  if(a.lf_matriculado==='Não') return m('lf_matriculado');
  if(a.lf_concluiuGrad==='Sim') return m('lf_concluiuGrad');
  if(a.lf_primeiraGrad==='Não') return m('lf_primeiraGrad');
  if(a.lf_brasileiro==='Não') return m('lf_brasileiro');
  if(a.lf_financiamentoIncompativel==='Sim') return m('lf_financiamentoIncompativel');
  return m('padrao');
}

function advanceQuiz(){
  const s=getQuizSteps();
  const curId=s[state.quizIndex];
  if(curId==='lf_stop'){ state.view='program'; return; }
  if(state.quizIndex<s.length-1) state.quizIndex++;
  else state.view='review';
}

function viewQuiz(){const steps=getQuizSteps();if(state.quizIndex>=steps.length)state.quizIndex=steps.length-1;const id=steps[state.quizIndex],cur=state.quizIndex+1,total=steps.length,pct=Math.round(cur/total*100);const autoSet=state.program==='federal'?LF_AUTO_ADVANCE_FIELDS:AUTO_ADVANCE_FIELDS;const auto=autoSet.has(id);return `<div class="progress-wrap fade-in"><div class="progress-meta"><span class="progress-step">Etapa ${cur} de ${total}</span><span class="progress-step" style="color:var(--ink-faint)">${programLabel()}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="q-card fade-in">${renderQuizStep(id)}</div><div class="nav-row"><button class="btn btn-secondary" data-action="quiz-back">${ICONS.back}</button>${auto?`<span style="font-size:12px;color:var(--ink-faint);text-align:right;flex:1;">Toque em uma opção para continuar</span>`:`<button class="btn btn-primary on-light btn-block" data-action="quiz-next" ${canAdvance(id)?'':'disabled'}>${id==='lf_stop'?'Voltar aos programas':'Continuar'} ${ICONS.chev}</button>`}</div>`;}
function q(title,help,body){return `<h3 class="q-title">${title}</h3><p class="q-help">${help}</p>${body}`;}
function opt(v,l,current,field,multi=false){const sel=multi?current.includes(v):current===v;return `<button class="opt-btn ${sel?'selected':''} ${multi?'multi':''}" data-action="${multi?'toggle-field':'answer'}" data-field="${escapeAttr(field)}" data-value="${escapeAttr(v)}"><span>${escapeHtml(l)}</span>${multi?`<span class="check-box">${sel?ICONS.check:''}</span>`:`<span class="chev">${ICONS.chev}</span>`}</button>`;}
function yesno(field){return ['Sim','Não'].map(v=>opt(v,v,state.answers[field],field)).join('');}
function renderQuizStep(id){if(state.program==='federal')return renderQuizStepLF(id);const a=state.answers;switch(id){
 case'nasceuSC':return perguntaTexto('nasceuSC');
 case'resideSC5':return perguntaTexto('resideSC5');
 case'graduacaoAnterior':return perguntaTexto('graduacaoAnterior');
 case'deficiencia':return perguntaTexto('deficiencia');
 case'recebeAjuda':return perguntaTexto('recebeAjuda');
 case'pagaSozinho':return perguntaTexto('pagaSozinho');
 case'outraPessoa':return perguntaTexto('outraPessoa');
 case'estudanteRenda':return perguntaTexto('estudanteRenda');
 case'familia':return stepFamilia();
 case'moradia':return perguntaTexto('moradia');
 case'aluguelContrato':return perguntaTexto('aluguelContrato');
 case'inventarioAberto':return perguntaTexto('inventarioAberto');
 case'patrimonioPossui':return perguntaTexto('patrimonioPossui');
 case'patrimonioTipos':return perguntaTexto('patrimonioTipos');
 case'patrimonioIR':return perguntaTexto('patrimonioIR');
 case'enderecoConta':return perguntaTexto('enderecoConta');
 default:return '';
}}
function canAdvance(id){if(state.program==='federal')return canAdvanceLF(id);const a=state.answers;if(id==='familia')return true;if(id==='patrimonioTipos')return a.patrimonioTipos.length>0;return a[id]!==null&&a[id]!=='';}
function canAdvanceLF(id){const a=state.answersLF;if(id==='lf_familia')return true;if(id==='lf_stop')return true;return a[id]!==null&&a[id]!=='';}

function stepFamilia(){const fam=state.answers.familia;return `<h3 class="q-title">Cadastre os integrantes do seu grupo familiar</h3><p class="q-help">Para cada pessoa, informe idade e principal situação de renda. O checklist será separado por integrante.</p><div class="fam-list">${fam.length?fam.map(m=>`<div class="fam-item"><div class="fam-avatar">${initials(m.nome)}</div><div class="fam-info"><div class="fam-name">${escapeHtml(m.nome)} · ${escapeHtml(m.parentesco)}</div><div class="fam-meta">${m.maior16==='Sim'?'16 anos ou mais':'Menos de 16 anos'} · ${escapeHtml(rendaLabel(m.renda))}</div></div><button class="icon-btn" data-action="edit-member" data-id="${m.id}">${ICONS.edit}</button><button class="icon-btn danger" data-action="remove-member" data-id="${m.id}">${ICONS.trash}</button></div>`).join(''):`<p style="font-size:13px;color:var(--ink-faint);padding:6px 0;">Nenhum integrante adicional cadastrado. O estudante já será considerado no checklist.</p>`}</div><button class="add-fam-btn" data-action="add-member">+ Adicionar integrante</button><div class="notice info" style="margin-top:14px;">${ICONS.info}<div><strong>Quem deve ser incluído?</strong><p>Inclua quem ajuda você a se manter ou depende financeiramente de você, conforme sua realidade familiar.</p></div></div>`;}
function rendaLabel(v){const x=RENDA_TIPOS.find(o=>o.v===v);return x?x.l:'Situação não informada';}
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();}

ry on-light btn-block" data-action="modal-save">Salvar integrante</button></div></div></div>`;}

function viewReview(){return state.program==='federal'?viewReviewLF():viewReviewUG();}
function viewReviewUG(){const a=state.answers;return `<div class="progress-wrap fade-in"><button class="back-link" data-action="review-back">${ICONS.back} Voltar ao questionário</button></div><div class="section-eyebrow">Conferência</div><h2 class="h-title">Confira suas respostas</h2><p class="h-sub">O checklist será montado somente com regras acionadas pelas respostas.</p>${reviewSection('Sobre você',[['Nasceu em SC',a.nasceuSC],...(a.nasceuSC==='Não'?[['Reside em SC há 5 anos',a.resideSC5]]:[]),['Graduação anterior com UG/FUMDESC',a.graduacaoAnterior],['Deficiência/invalidez',a.deficiencia],['Situação de renda',rendaLabel(a.estudanteRenda)]])}${reviewSection('Grupo familiar',[['Recebe ajuda',a.recebeAjuda],['Consegue se manter sozinho',a.pagaSozinho||'—'],['Outra pessoa ajuda/depende',a.outraPessoa],['Integrantes adicionais',String(a.familia.length)]])}${reviewSection('Moradia',[['Tipo',optLabel(MORADIA_OPTS,a.moradia)],...(a.moradia==='alugada'?[['Contrato vigente',a.aluguelContrato]]:[]),...(a.moradia==='inventario'?[['Inventário aberto',a.inventarioAberto]]:[])])}${reviewSection('Patrimônio',[['Possui bens',a.patrimonioPossui],...(a.patrimonioPossui==='Sim'?[['Tipos',a.patrimonioTipos.map(v=>optLabel(PATRIMONIO_OPTS,v)).join(', ')],['Constam no IRPF',a.patrimonioIR]]:[])])}${reviewSection('Comprovante de endereço',[['Possui conta recente',a.enderecoConta]])}<button class="btn btn-primary on-light btn-block btn-lg" style="margin-top:8px" data-action="generate-checklist">Gerar meu checklist ${ICONS.chev}</button>`;}
function viewReviewLF(){const a=state.answersLF;return `<div class="progress-wrap fade-in"><button class="back-link" data-action="review-back">${ICONS.back} Voltar ao questionário</button></div><div class="section-eyebrow">Conferência</div><h2 class="h-title">Confira suas respostas</h2><p class="h-sub">O checklist será montado somente com regras acionadas pelas respostas.</p>${reviewSection('Elegibilidade',[['Matriculado em graduação presencial',a.lf_matriculado],['Primeira graduação',a.lf_primeiraGrad],['Brasileiro/naturalizado',a.lf_brasileiro],['Financiamento incompatível',a.lf_financiamentoIncompativel],['Bolsa pretendida',a.lf_bolsaIntegral==='Sim'?'Integral (100%)':'Parcial (50%)']])}${reviewSection('Grupo familiar',[['Mora sozinho',a.lf_moraSozinho],['Dependente no IR de terceiros',a.lf_dependenteIR],['Pai/mãe fora do grupo',a.lf_paisForaGrupo],['Integrantes cadastrados',String(a.familiaLF.length)]])}${reviewSection('Renda do estudante',[['Possui renda',a.lf_estudanteTemRenda],...(a.lf_estudanteTemRenda==='Sim'?[['Fonte de renda',lfRendaLabel(a.lf_estudanteRenda)]]:[])])}${reviewSection('Moradia',[['Tipo',a.lf_moradia],...(a.lf_moradia==='Alugada'?[['Tipo de contrato',a.lf_aluguelTipo||'—'],['Sublocação/república',a.lf_sublocacao||'—']]:[])])}${reviewSection('Patrimônio e despesas',[['Possui patrimônio',a.lf_patrimonioPossui],['Outro membro em escola particular',a.lf_outroMembroParticular],['Doença crônica/deficiência',a.lf_doencaCronica],['Transporte coletivo',a.lf_transporteColetivo]])}${reviewSection('Comprovante de residência',[['Conta recente em 2026',a.lf_contaConsumo]])}<button class="btn btn-primary on-light btn-block btn-lg" style="margin-top:8px" data-action="generate-checklist">Gerar meu checklist ${ICONS.chev}</button>`;}
function reviewSection(title,rows){return `<div class="rev-section"><div class="rev-head"><h3>${title}</h3></div>${rows.map(r=>`<div class="rev-row"><span class="rev-key">${escapeHtml(r[0])}</span><span class="rev-val">${escapeHtml(r[1]??'—')}</span></div>`).join('')}</div>`;}
function optLabel(list,v){const x=list.find(o=>o.v===v);return x?x.l:(v||'—');}

function doc(text,url){return {text,url:url||null};}
function rendaDocs(tipo,nome){const base=[doc('Anexo II — Declaração de Renda ou Ausência de Renda Individual',DOCS.anexoII)];switch(tipo){
 case'assalariado':return base.concat([doc('Holerites/contracheques do período definido no edital'),doc('CTPS Digital ou contrato, se o vínculo começou há 90 dias ou menos'),doc('Termo de Rescisão completo, se houve desligamento nos últimos 6 meses')]);
 case'estagio':return base.concat([doc('Termo de Compromisso de Estágio com o valor da bolsa ou comprovante/holerite do mês de referência')]);
 case'autonomo':return base.concat([doc('Anexo II — item 3: descrição da atividade e média recebida no período definido no edital',DOCS.anexoII)]);
 case'agricultura':return base.concat([doc('IRPF completo + documentos da atividade, se a renda for declarada no IR'),doc('Se não declarada no IR: consulta de restituição + declaração de movimento econômico/declaração correspondente')]);
 case'mei':return base.concat([doc('CCMEI vigente'),doc('Declaração Anual do SIMEI')]);
 case'empresa':return base.concat([doc('Contrato social'),doc('DRE + balancete'),doc('DEFIS ou DECORE, quando houver movimentação'),doc('Anexo VI — Declaração de Escrituração Contábil',DOCS.anexoVI)]);
 case'aluguel':return base.concat([doc('IRPF, se a renda estiver declarada; ou contrato/declaração de locação/arrendamento'),doc('Comprovantes de recebimento')]);
 case'beneficio':return base.concat([doc('Extrato do benefício do mês de referência; incluir todos os benefícios recebidos')]);
 case'pensao_alimenticia':return base.concat([doc('Sentença, quando houver decisão judicial; caso contrário, informar no Anexo II o valor recebido')]);
 case'ajuda':return base.concat([doc('Informar no Anexo II a origem do dinheiro e a média mensal recebida')]);
 case'investimentos':return base.concat([doc('IRPF completo, se declarado; ou informe anual de rendimentos bancários — regra marcada para validação interna')]);
 case'desempregado':return base.concat([doc('Se recebe seguro-desemprego: informar média recebida no Anexo II'),doc('Se não recebe: Anexo II — item 10 + declaração de que não exerce atividade remunerada')]);
 default:return base.concat([doc('Comprovação correspondente à situação informada — orientação institucional necessária')]);
}}
function buildChecklist(){const a=state.answers;const blocks=[];const attn=[];
 const estudante=[doc('Documento de identificação'),doc('Comprovante de residência')];
 if(a.nasceuSC==='Sim') estudante.push(doc('Comprovação de naturalidade em Santa Catarina'));
 if(a.nasceuSC==='Não'&&a.resideSC5==='Sim') estudante.push(doc('Comprovação de residência contínua em Santa Catarina por 5 anos'));
 if(a.nasceuSC==='Não'&&a.resideSC5==='Não') attn.push('Vínculo com Santa Catarina: a situação deve ser encaminhada para orientação institucional antes do envio.');
 if(a.graduacaoAnterior==='Não') estudante.push(doc('Anexo VII — Declaração de não utilização de recursos públicos em outra graduação',DOCS.anexoVII));
 if(a.graduacaoAnterior==='Sim') attn.push('Graduação anterior com Universidade Gratuita/FUMDESC: encaminhar para análise da situação.');
 if(a.deficiencia==='Sim') estudante.push(doc('Laudo/atestado médico com CID ou Anexo VIII, conforme o caso',DOCS.anexoVIII));
 estudante.push(...rendaDocs(a.estudanteRenda,'Estudante'));
 blocks.push({title:'Documentos do estudante',tag:rendaLabel(a.estudanteRenda),docs:estudante});
 a.familia.forEach(m=>{const docs=[doc('Documento de identificação')];if(m.maior16==='Sim'){docs.push(doc('CNIS'),doc('IRPF completo ou consulta aplicável'));}docs.push(...rendaDocs(m.renda,m.nome));blocks.push({title:`${m.nome} — ${m.parentesco}`,tag:rendaLabel(m.renda),docs});});
 const mor=[];
 if(a.moradia==='alugada'){if(a.aluguelContrato==='Sim')mor.push(doc('Contrato vigente'),doc('Comprovante de pagamento'),doc('Anexo III — Tipo de Moradia',DOCS.anexoIII));else mor.push(doc('Declaração do proprietário'),doc('Comprovante de pagamento'),doc('Anexo III — Tipo de Moradia',DOCS.anexoIII));}
 if(a.moradia==='cedida')mor.push(doc('Declaração de moradia cedida'),doc('Comprovante de endereço'),doc('Documentos do proprietário, quando necessários'),doc('Anexo III — Tipo de Moradia',DOCS.anexoIII));
 if(a.moradia==='financiada')mor.push(doc('Contrato de financiamento'),doc('Extrato atualizado do financiamento'),doc('Anexo III — Tipo de Moradia',DOCS.anexoIII));
 if(a.moradia==='propria')mor.push(doc('Escritura, contrato de compra e venda, IPTU, DITR ou matrícula'),doc('Anexo III — Tipo de Moradia',DOCS.anexoIII));
 if(a.moradia==='posse')mor.push(doc('Sentença, ata notarial, termo de posse ou averbação correspondente'));
 if(a.moradia==='inventario'){mor.push(doc('Documentação correspondente ao inventário'));if(a.inventarioAberto==='Não')attn.push('Imóvel em inventário ainda não aberto: buscar orientação institucional para a comprovação adequada.');}
 if(a.moradia==='outra')attn.push('Situação de moradia não padronizada: verificar orientação institucional antes do envio.');
 if(mor.length)blocks.push({title:'Moradia',tag:optLabel(MORADIA_OPTS,a.moradia),docs:mor});
 if(a.patrimonioPossui==='Não'){blocks.push({title:'Bens e patrimônio',tag:'Ausência de patrimônio',docs:[doc('Anexo V — Declaração “Não possuo bens” para cada integrante, conforme aplicável',DOCS.anexoV)]});}
 else {const pd=a.patrimonioTipos.map(v=>doc(`Comprovação oficial do bem: ${optLabel(PATRIMONIO_OPTS,v)}`));if(a.patrimonioIR==='Sim, todos aparecem')pd.unshift(doc('IRPF completo dos titulares como comprovação dos bens'));else if(a.patrimonioIR==='Não, há bem não declarado')pd.unshift(doc('Anexo V para bens não declarados no IRPF, nas hipóteses previstas',DOCS.anexoV));else attn.push('Há dúvida se os bens constam no IRPF: conferir antes de finalizar a documentação.');blocks.push({title:'Bens e patrimônio',tag:'Patrimônio informado',docs:pd});}
 if(a.enderecoConta==='Sim')blocks.push({title:'Comprovante de endereço',tag:'Endereço',docs:[doc('Conta recente de água, luz, telefone, internet, gás ou outro serviço no endereço informado')]});else attn.push('Sem conta recente no endereço informado: verificar conta em nome de integrante do grupo familiar no mesmo endereço ou buscar orientação institucional.');
 if(a.patrimonioTipos.includes('empresa')) attn.push('Participação em empresa pode acionar também documentação de renda/contabilidade do titular.');
 return {blocks,attn};
}
/* ---------------- Lei Federal (LF) — montagem do checklist ---------------- */
function lfRendaDocs(tipo){switch(tipo){
 case'assalariado':return [doc('Folhas de pagamento de novembro/2025, dezembro/2025 e janeiro/2026'),doc('Termo de Rescisão completo e comprovante de seguro-desemprego, se recebido, em caso de rescisão nesses meses')];
 case'aposentado':return [doc('Extrato/histórico do benefício de novembro/2025, dezembro/2025 e janeiro/2026'),doc('Comprovantes de previdência privada dos mesmos meses, quando houver'),doc('CNIS — obrigatório para maiores de 16 anos')];
 case'estagio':return [doc('Contrato ou Termo de Compromisso de Estágio'),doc('Comprovantes de remuneração de novembro/2025, dezembro/2025 e janeiro/2026; se inexistentes, declaração da entidade com início, carga horária e valor')];
 case'autonomo':return [doc('Anexo II — assinado e datado, com média dos rendimentos de janeiro a dezembro/2025',DOCS_LF.anexoII),doc('CNIS — obrigatório para maiores de 16 anos')];
 case'produtor_rural':return [doc('Relatório econômico da Prefeitura de janeiro a dezembro/2025'),doc('Anexo III com renda, custos e rendas não registradas no Bloco de Produtor',DOCS_LF.anexoIII),doc('Declaração de todos os blocos, se mais de um membro possuir bloco de produtor')];
 case'demais_rendas':return [doc('Anexo IV com média de novembro/2025, dezembro/2025 e janeiro/2026 (pensão, bicos, ajuda, aluguel, arrendamento)',DOCS_LF.anexoIV)];
 case'socio_ativo':return [doc('Contrato social e alterações'),doc('Balanço Patrimonial e DRE do último exercício'),doc('DEFIS ou DECORE, conforme regime'),doc('Anexo VIII com o valor, se houver rendimentos informais; caso contrário, Anexo VIII com R$ 0,00',DOCS_LF.anexoVIII),doc('Se CNPJ ativo sem movimentação: contrato social + DRE + balancete recentes + declaração contábil de ausência de faturamento')];
 case'socio_inativa':return [doc('DCTF de baixa e demais documentos conforme a situação'),doc('Comprovante de situação cadastral, se CNPJ inapto ou MEI cancelado/suspenso'),doc('Documentação da baixa, se o CNPJ foi baixado no período de referência, ou comprovação do período ativo, se houve movimentação')];
 case'mei':return [doc('Anexo VII com a média bruta mensal de rendimentos formais, informais e distribuição de lucros de janeiro a dezembro/2024',DOCS_LF.anexoVII),doc('CCMEI atualizado'),doc('DASN MEI do último exercício')];
 default:return [doc('Comprovação correspondente à situação informada — orientação institucional necessária')];
}}

function buildChecklistLF(){
 const a=state.answersLF;const blocks=[];const attn=[];
 const estudante=[doc('Documento de identificação'),doc('Comprovante de residência')];
 if(a.lf_estudanteTemRenda==='Sim') estudante.push(...lfRendaDocs(a.lf_estudanteRenda));
 else estudante.push(doc('Anexo IV com R$ 0,00',DOCS_LF.anexoIV));
 blocks.push({title:'Documentos do estudante',tag:a.lf_estudanteTemRenda==='Sim'?lfRendaLabel(a.lf_estudanteRenda):'Sem renda declarada',docs:estudante});

 if(a.lf_paisForaGrupo==='Sim') attn.push('Um ou ambos os pais não fazem parte do grupo familiar: será necessário informar o motivo e apresentar a comprovação correspondente.');
 if(a.lf_grupoSemVinculo==='Sim') attn.push('Grupo familiar composto somente por avós, tios ou pessoa sem vínculo familiar direto: é exigido o Termo de Guarda e Responsabilidade judicial.');
 if(a.lf_dependenteIR==='Sim') attn.push('Você ou um membro do grupo familiar aparece como dependente no IR de outra pessoa: o declarante também deve ser incluído no grupo familiar.');

 a.familiaLF.forEach(m=>{
  const docs=[];
  if(m.maior16==='Sim'){docs.push(doc('Documento de identificação (RG/CNH)'));docs.push(doc('CNIS'));docs.push(doc('IRPF completo ou consulta de restituição, quando aplicável'));}
  else {docs.push(doc('Documento de identificação ou Certidão de Nascimento com CPF, para menores de 18 anos'));docs.push(doc('Documentação de patrimônio/bens, quando houver, sem exigência de CNIS/IRPF apenas pela idade'));}
  if(m.temRenda==='Sim') docs.push(...lfRendaDocs(m.renda)); else docs.push(doc('Anexo IV com R$ 0,00',DOCS_LF.anexoIV));
  if(m.situacaoFamiliar&&m.situacaoFamiliar!=='nenhuma'){
   const map={casamento:'Certidão de casamento ou comprovação de união estável',divorcio:'Certidão/sentença de divórcio ou separação',obito:'Certidão de óbito',guarda:'Termo de guarda, curatela ou tutela'};
   docs.push(doc(map[m.situacaoFamiliar]||'Documento correspondente à situação familiar informada'));
  }
  blocks.push({title:`${m.nome} — ${m.parentesco}`,tag:m.temRenda==='Sim'?lfRendaLabel(m.renda):'Sem renda',docs});
 });

 if(a.lf_patrimonioPossui==='Não') blocks.push({title:'Bens e patrimônio',tag:'Ausência de patrimônio',docs:[doc('Anexo V declarando ausência de patrimônio',DOCS_LF.anexoV)]});
 else blocks.push({title:'Bens e patrimônio',tag:'Patrimônio informado',docs:[doc('Anexo V com a composição do patrimônio de todo o grupo familiar (imóveis, veículos, poupança, participações societárias, quotas, máquinas, benfeitorias agrícolas, aplicações, ações, gado etc.)',DOCS_LF.anexoV)]});

 const mor=[];
 if(a.lf_moradia==='Alugada'){
  mor.push(doc('Contrato vigente'),doc('Comprovante de pagamento'));
  if(a.lf_aluguelTipo==='Particular') mor.push(doc('Contrato particular com firma reconhecida ou assinatura digital gov.br'));
  else if(a.lf_aluguelTipo==='Imobiliária') mor.push(doc('Contrato atualizado emitido pela imobiliária'));
  if(a.lf_sublocacao==='Sim') mor.push(doc('Anexo X, em caso de sublocação ou divisão em república',DOCS_LF.anexoX));
 } else if(a.lf_moradia==='Cedida'){
  mor.push(doc('Anexo IX preenchido pelo cedente, com firma reconhecida ou assinatura digital gov.br',DOCS_LF.anexoIX));
 } else if(a.lf_moradia==='Financiada'){
  mor.push(doc('Comprovante da prestação (extrato da Caixa ou contrato), atualizado ou dentro do período de referência'));
 } else if(a.lf_moradia==='Outra situação'){
  attn.push('Situação de moradia não padronizada: procure orientação institucional antes do envio.');
 }
 if(mor.length) blocks.push({title:'Moradia',tag:a.lf_moradia,docs:mor});

 const desp=[];
 if(a.lf_outroMembroParticular==='Sim') desp.push(doc('Matrícula e comprovante de pagamento da instituição particular de educação regular'));
 if(a.lf_doencaCronica==='Sim') desp.push(doc('Anexo VI preenchido pelo médico',DOCS_LF.anexoVI),doc('Notas fiscais ou recibos das despesas'));
 if(a.lf_transporteColetivo==='Sim') desp.push(doc('Comprovante de recarga, recibo/declaração de transporte ou declaração do empregador'));
 if(desp.length) blocks.push({title:'Despesas',tag:'Despesas declaradas',docs:desp});

 if(a.lf_contaConsumo==='Sim') blocks.push({title:'Comprovante de residência',tag:'Endereço',docs:[doc('Conta de energia, água, telefone, internet, cartão de crédito, gás ou equivalente, emitida em 2026')]});
 else attn.push('Sem conta de consumo emitida em 2026 em seu nome: verifique comprovante em nome de outro membro residente no mesmo endereço; se estudante e grupo familiar morarem em endereços diferentes, apresente os dois comprovantes.');

 if(a.lf_bolsaIntegral==='Sim') attn.push('Bolsa integral (100%): limite de renda per capita de até 1,5 salário mínimo.');
 else if(a.lf_bolsaIntegral==='Não') attn.push('Bolsa parcial (50%): limite de renda per capita de até 3 salários mínimos.');

 return {blocks,attn};
}

function checklistInitials(title){
 const clean=String(title||'').replace(/^Documentos do\s+/i,'').trim();
 if(/^Moradia$/i.test(clean)) return 'MO';
 if(/^Bens/i.test(clean)) return 'BP';
 if(/^Comprovante/i.test(clean)) return 'EN';
 return clean.split(/[\s—-]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'UG';
}
function viewChecklist(){
 const c=state.program==='federal'?buildChecklistLF():buildChecklist();
 const groups=c.blocks.map(b=>`<section class="doc-group">
   <div class="doc-head"><div class="doc-head-main"><div class="doc-avatar">${escapeHtml(checklistInitials(b.title))}</div><div><h3>${escapeHtml(b.title)}</h3><span>${escapeHtml(b.tag||'Documentos aplicáveis')}</span></div></div></div>
   <div class="doc-table-head"><span></span><span>Documento necessário</span><span class="model-col">Modelo</span></div>
   ${b.docs.map(d=>`<div class="doc-row"><div class="doc-check"></div><div class="doc-info"><strong>${escapeHtml(d.text)}</strong></div><div class="model-cell">${d.url?`<a class="model-btn" href="${d.url}" target="_blank" rel="noopener">Visualizar modelo ↗</a>`:`<span class="model-empty">Modelo no Minha UNO</span>`}</div></div>`).join('')}
 </section>`).join('');
 return `<div class="progress-wrap fade-in"><button class="back-link" data-action="review-back">${ICONS.back} Voltar</button></div>
 <div class="check-hero fade-in"><div class="check-icon">${ICONS.check}</div><div><div class="section-eyebrow" style="color:var(--uno-cyan)">Checklist personalizado</div><h2 class="h-title">Sua lista está pronta</h2><p class="h-sub">Organizamos os documentos por estudante, integrante e assunto. Use a coluna “Modelo” quando houver um formulário oficial disponível.</p></div></div>
 ${c.attn.length?`<div class="notice warn attn-clean">${ICONS.warn}<div><strong>Pontos de atenção</strong>${c.attn.map(x=>`<p>• ${escapeHtml(x)}</p>`).join('')}</div></div>`:''}
 ${groups}
 <div class="notice info" style="margin-top:18px">${ICONS.info}<div><strong>Importante</strong><p>O UNO Guia+ é orientativo e não substitui a análise, homologação ou decisão da Universidade.</p></div></div>
 <div class="nav-row"><button class="btn btn-secondary" data-action="restart">Recomeçar</button><button class="btn btn-primary on-light btn-block" data-action="go-minha-uno">Acessar Minha UNO ${ICONS.chev}</button></div>`;
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escapeAttr(s){return escapeHtml(s);}
function bindEvents(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',onAction));document.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click',e=>e.stopPropagation()));['m-nome','m-parentesco','m-maior16','m-renda','m-temRenda','m-situacaoFamiliar'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',e=>{const k=id.replace('m-','');window.__memberDraft[k]=e.target.value;});});}
function onAction(e){const el=e.currentTarget,act=el.dataset.action,a=state.answers;const set=(k)=>a[k]=el.dataset.value;switch(act){
 case'start':state.view='program';break;case'to-welcome':state.view='welcome';break;case'to-program':state.view='program';break;
 case'select-program':state.program=el.dataset.program;state.view='quiz';state.quizIndex=0;break;
 case'answer':{const ansObj=state.program==='federal'?state.answersLF:state.answers;ansObj[el.dataset.field]=el.dataset.value;const autoSet=state.program==='federal'?LF_AUTO_ADVANCE_FIELDS:AUTO_ADVANCE_FIELDS;if(state.view==='quiz'&&autoSet.has(el.dataset.field))advanceQuiz();break;}
 case'toggle-field':{const f=el.dataset.field,v=el.dataset.value,arr=a[f],i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);break;}
 case'add-member':state.editingMemberId=null;window.__memberDraft=state.program==='federal'?{id:null,nome:'',parentesco:PARENTESCO_OPTS[0],maior16:'Sim',temRenda:'Não',renda:'assalariado',situacaoFamiliar:'nenhuma'}:{id:null,nome:'',parentesco:PARENTESCO_OPTS[0],maior16:'Sim',renda:'desempregado'};modalOpen=true;break;
 case'edit-member':state.editingMemberId=el.dataset.id;window.__memberDraft=null;modalOpen=true;break;
 case'remove-member':if(state.program==='federal'){state.answersLF.familiaLF=state.answersLF.familiaLF.filter(m=>m.id!==el.dataset.id);}else{a.familia=a.familia.filter(m=>m.id!==el.dataset.id);}break;
 case'modal-cancel':case'modal-overlay':modalOpen=false;window.__memberDraft=null;state.editingMemberId=null;break;
 case'modal-save':{const d=window.__memberDraft;if(!d.nome)d.nome=d.parentesco;if(state.program==='federal'){const arr=state.answersLF.familiaLF;if(state.editingMemberId){const i=arr.findIndex(m=>m.id===state.editingMemberId);if(i>=0)arr[i]={...d,id:state.editingMemberId};}else arr.push({...d,id:'m'+Date.now()+Math.random().toString(16).slice(2)});}else{if(state.editingMemberId){const i=a.familia.findIndex(m=>m.id===state.editingMemberId);if(i>=0)a.familia[i]={...d,id:state.editingMemberId};}else a.familia.push({...d,id:'m'+Date.now()+Math.random().toString(16).slice(2)});}modalOpen=false;window.__memberDraft=null;state.editingMemberId=null;break;}
 case'quiz-next':advanceQuiz();break;
 case'quiz-back':if(state.quizIndex>0)state.quizIndex--;else state.view='program';break;
 case'review-back':state.view='quiz';state.quizIndex=Math.max(0,getQuizSteps().length-1);break;
 case'generate-checklist':state.view='checklist';break;case'go-minha-uno':window.open('https://minha.uno.edu.br','_blank');break;case'restart':resetState();break;
 }render();}
function resetState(){state.view='welcome';state.program=null;state.quizIndex=0;state.editingMemberId=null;state.answers={nasceuSC:null,resideSC5:null,graduacaoAnterior:null,deficiencia:null,recebeAjuda:null,pagaSozinho:null,outraPessoa:null,estudanteRenda:null,familia:[],moradia:null,aluguelContrato:null,inventarioAberto:null,patrimonioPossui:null,patrimonioTipos:[],patrimonioIR:null,enderecoConta:null};state.answersLF={lf_matriculado:null,lf_concluiuGrad:null,lf_primeiraGrad:null,lf_brasileiro:null,lf_financiamentoIncompativel:null,lf_bolsaIntegral:null,lf_moraSozinho:null,lf_ajudaMesmoSozinho:null,lf_outroEnderecoDepende:null,lf_dependenteIR:null,lf_paisForaGrupo:null,lf_grupoSemVinculo:null,familiaLF:[],lf_estudanteTemRenda:null,lf_estudanteRenda:null,lf_patrimonioPossui:null,lf_moradia:null,lf_aluguelTipo:null,lf_sublocacao:null,lf_outroMembroParticular:null,lf_doencaCronica:null,lf_transporteColetivo:null,lf_contaConsumo:null};modalOpen=false;window.__memberDraft=null;}
render();

</script>
